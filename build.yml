name: Build PrettyGet (Windows)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}   # permite lanzarlo a mano desde la pestaña "Actions" en GitHub

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cachear dependencias de Rust (acelera builds siguientes)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Instalar dependencias de Node (CLI de Tauri)
        run: npm install

      - name: Compilar la app (genera .msi y .exe)
        run: npm run build

      - name: Subir instaladores como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: PrettyGet-instaladores
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
