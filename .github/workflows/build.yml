name: Build PrettyGet (Windows)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]        # un tag v* compila Y publica la release
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}   # permite lanzarlo a mano desde la pestaña "Actions" en GitHub

# Minimo privilegio: solo lectura por defecto. El job de release lo amplia.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout del repo
        uses: actions/checkout@v6

      # La version vive en tres ficheros. Si se desincronizan, o si un tag no
      # coincide con ellos, el build falla aqui en vez de publicar instaladores
      # con un numero que no es el del tag (paso lo con v0.1.1 -> binarios 0.1.0).
      - name: Comprobar que las versiones cuadran
        shell: bash
        run: |
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          pkg=$(node -p "require('./package.json').version")
          crate=$(grep -m1 '^version = ' src-tauri/Cargo.toml | cut -d'"' -f2)
          echo "tauri.conf.json=$conf  package.json=$pkg  Cargo.toml=$crate"
          if [ "$conf" != "$pkg" ] || [ "$conf" != "$crate" ]; then
            echo "::error::Las versiones no coinciden entre los tres ficheros."
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/v}"
            if [ "$tag" != "$conf" ]; then
              echo "::error::El tag v$tag no coincide con la version $conf del codigo."
              exit 1
            fi
            echo "Tag v$tag coincide con la version del codigo."
          fi

      - name: Instalar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Instalar Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cachear dependencias de Rust (acelera builds siguientes)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            tools/prettyget-daemon -> target

      - name: Instalar dependencias de Node (CLI de Tauri)
        run: npm install

      - name: Compilar la app (genera .msi y .exe)
        run: npm run build

      # El daemon es un crate aparte y hasta ahora no lo compilaba nadie: podia
      # romperse sin que ningun build se enterase, y no habia binario que instalar.
      - name: Compilar el daemon (servicio de Windows)
        run: cargo build --release --manifest-path tools/prettyget-daemon/Cargo.toml

      - name: Subir instaladores como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: PrettyGet-instaladores
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            tools/prettyget-daemon/target/release/prettyget-daemon.exe
          if-no-files-found: error

  release:
    # Solo al pushear un tag v*. Publica la release con los binarios ya compilados,
    # asi el nombre del binario y el tag salen siempre del mismo commit.
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Descargar los instaladores del job anterior
        uses: actions/download-artifact@v4
        with:
          name: PrettyGet-instaladores
          path: dist

      - name: Publicar la release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
          fail_on_unmatched_files: true
