[package]
name = "prettyget-daemon"
version = "0.1.0"
edition = "2021"
publish = false

# Servicio de Windows que ejecuta winget en segundo plano (LocalSystem, sin UAC).
# Lee su configuración de %ProgramData%\PrettyGet\daemon.json y registra en daemon.log.

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"

[target.'cfg(windows)'.dependencies]
windows-service = "0.7"

[[bin]]
name = "prettyget-daemon"
path = "src/main.rs"
