[package]
name = "prettyget"
version = "0.1.2"
description = "A clean desktop front-end for winget"
authors = ["Gohsty"]
license = "GPL-3.0-only"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"    # abre enlaces externos (pestaña Donar) en el navegador del sistema
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"           # StateSync: export/import en YAML

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
