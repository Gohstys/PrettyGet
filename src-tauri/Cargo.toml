[package]
name = "prettyget"
version = "0.1.0"
description = "Una interfaz bonita para winget"
authors = ["Gohsty"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"    # abre enlaces externos (pestaña Donar) en el navegador del sistema
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# --- Capa Pro ---
ed25519-dalek = "2"          # verificación de licencias (solo clave pública)
base64 = "0.22"              # codificación del token de licencia
sha2 = "0.10"               # hash del ID de hardware
serde_yaml = "0.9"           # StateSync: export/import en YAML
[target.'cfg(windows)'.dependencies]
winreg = "0.52"              # leer MachineGuid para el HWID

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
